[package]
name = "taukudu"
version = "0.1.0"
description = "High-performance, open-source system cleaner, deduplication tool, and security suite"
edition = "2021"
authors = ["TauKudu Contributors"]
license = "MIT"

[lib]
name = "taukudu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
rayon = "1.10"
regex = "1.10"
sysinfo = "0.33"
rusqlite = { version = "0.33", features = ["bundled"] }
blake3 = "1.5"
zeroize = "1.8"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.5"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Security"
] }
winreg = "0.52"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
