# requirements.yaml — SSOT for BG · CAP · FR · NFR · UJ
#
# Keys are English; prose values follow the product's chosen `doc_language`.
# Numbers are allocated FROM HERE and MUST NOT restart per document, per component, or per release.
# The sequence is global to one product.

goals:
  - id: BG-1
    title: "Core value: Provide a free, open-source, cross-platform system cleaner that reclaims disk space and optimizes performance"
  - id: BG-2
    title: "Integrate malware scanning with signature matching and heuristic analysis"
  - id: BG-3
    title: "Give users granular control over 30+ Windows privacy settings"
  - id: BG-4
    title: "Support 30+ languages for global accessibility"
  - id: BG-5
    title: "Enable scriptable CLI mode for automation and headless operation"

