functional:
  - id: FR-1
    title: "Scan and clean system temp files and caches"
    capability: CAP-1
    proof_of_done: "User selects System Cleaner, runs scan, sees categorized file list with reclaimable size, clicks clean, and verified files are removed."
  - id: FR-2
    title: "Scan and clean browser caches and cookies"
    capability: CAP-2
    proof_of_done: "User selects Browser Cleaner for Chrome/Firefox/Safari/Edge, runs scan, sees itemized cache sizes, clicks clean, and browser caches are purged."
  - id: FR-3
    title: "Scan and clean application leftover data"
    capability: CAP-3
    proof_of_done: "User selects App Cleaner, runs scan, sees detected third-party app caches/logs, clicks clean, and target files are removed."
  - id: FR-4
    title: "Scan and clean game launcher and shader caches"
    capability: CAP-4
    proof_of_done: "User selects Gaming Cleaner, scans Steam/Epic/DirectX shader caches, sees reclaimable space, clicks clean, and shader caches are deleted."
  - id: FR-5
    title: "Scan and fix broken Windows registry entries"
    capability: CAP-5
    proof_of_done: "User selects Registry Cleaner on Windows, scans for orphaned entries, sees itemized list with issue descriptions, clicks fix, and invalid entries are removed."
  - id: FR-6
    title: "Analyze and manage startup applications"
    capability: CAP-6
    proof_of_done: "User opens Startup Manager, views all autostart programs with measured boot impact ratings, toggles any program on/off, and state persists."
  - id: FR-7
    title: "Visualize disk space usage with interactive treemap"
    capability: CAP-7
    proof_of_done: "User opens Disk Analyzer, selects a drive, views hierarchical treemap of space usage, clicks into folders to zoom, and can open items in file explorer."
  - id: FR-8
    title: "Remove pre-installed Windows bloatware"
    capability: CAP-8
    proof_of_done: "User selects Debloater on Windows, sees list of pre-installed UWP/system apps with safe-to-remove tags, selects items, and uninstalls them in batch."
  - id: FR-9
    title: "Clean stale and orphaned driver packages"
    capability: CAP-9
    proof_of_done: "User selects Driver Manager, scans for outdated driver packages in DriverStore, selects stale packages, and removes them."
  - id: FR-10
    title: "Uninstall programs and clean leftover files and registry keys"
    capability: CAP-10
    proof_of_done: "User selects Program Uninstaller, chooses an installed app, runs uninstall, and app automatically scans for and removes leftover files/keys."
  - id: FR-11
    title: "Configure and optimize Windows services"
    capability: CAP-11
    proof_of_done: "User opens Service Manager, views services with recommendations (safe to disable / manual / automatic), and applies recommended optimizations."
  - id: FR-12
    title: "Bulk-update installed software across package managers"
    capability: CAP-12
    proof_of_done: "User opens Software Updater, sees list of outdated packages across winget/Chocolatey/Scoop/npm, clicks update all, and packages are updated."
  - id: FR-13
    title: "Scan filesystem for malware using YARA rules and heuristics"
    capability: CAP-13
    proof_of_done: "User initiates Malware Scan (quick or full), scanner evaluates files against YARA rules and heuristic signatures, and displays detected threats with quarantine/delete options."
  - id: FR-14
    title: "Toggle Windows telemetry, advertising ID, and tracking settings"
    capability: CAP-14
    proof_of_done: "User opens Privacy Shield, views 30+ privacy settings organized by category with descriptions, toggles settings, and system policies are updated accordingly."
  - id: FR-15
    title: "Securely overwrite files before deletion"
    capability: CAP-15
    proof_of_done: "User drags files to Secure Delete or enables secure deletion mode, files are overwritten with random passes before filesystem unlinking, and space is unrecoverable."
  - id: FR-16
    title: "Display real-time system performance metrics and hardware health"
    capability: CAP-16
    proof_of_done: "User opens Performance Monitor, sees live CPU/memory/disk/network utilization graphs, per-core metrics, and disk S.M.A.R.T. health status."
  - id: FR-17
    title: "Create system restore points before cleaning operations"
    capability: CAP-17
    proof_of_done: "System automatically creates a Windows Restore Point before executing destructive cleaning operations when enabled, or user manually triggers one."
  - id: FR-18
    title: "Log and review cleaning history and reclaimed space"
    capability: CAP-18
    proof_of_done: "User navigates to History tab, views paginated list of past cleaning sessions with timestamps, categories cleaned, and total bytes reclaimed."
  - id: FR-19
    title: "Configure and execute scheduled automated scans"
    capability: CAP-19
    proof_of_done: "User sets a cleaning schedule (daily/weekly/monthly) with selected categories, and system performs automated scans at designated intervals."
  - id: FR-20
    title: "Execute one-click scan and clean across all enabled categories"
    capability: CAP-20
    proof_of_done: "User clicks One-Click Clean from dashboard, app scans all default-safe categories, displays summary of found items, and cleans upon confirmation."
  - id: FR-21
    title: "Execute cleaning, scanning, and monitoring via command-line interface"
    capability: CAP-21
    proof_of_done: "User runs `kudu clean --all` or `kudu scan` from terminal, CLI outputs structured progress and summary, and returns exit code 0 on success."
  - id: FR-22
    title: "Switch UI language across 30 supported locales"
    capability: CAP-22
    proof_of_done: "User selects language from settings dropdown, entire UI re-renders in chosen language immediately without app restart."
  - id: FR-23
    title: "Check for, download, and apply application updates automatically"
    capability: CAP-23
    proof_of_done: "App checks for new GitHub releases on launch, notifies user when update is available, downloads in background, and prompts to restart and apply."

nonfunctional:
  - id: NFR-1
    title: "Quick scan completes within 30 seconds on SSD systems"
    goal: BG-1
    enforced_by: "Performance benchmarking test suite running against standard 10GB test corpus"
  - id: NFR-2
    title: "UI thread remains responsive (>= 30 fps) during background scans"
    goal: BG-1
    enforced_by: "Electron IPC worker thread architecture separating UI from scan engine"
  - id: NFR-3
    title: "Zero telemetry collected or transmitted without explicit opt-in"
    goal: BG-3
    enforced_by: "Network request audit in CI blocking unauthorized outbound connections"
  - id: NFR-4
    title: "Memory footprint under 150MB during idle monitoring"
    goal: BG-1
    enforced_by: "Memory budget assertions in automated performance tests"
  - id: NFR-5
    title: "All cleaning rules validated against JSON schema in CI"
    goal: BG-1
    enforced_by: "npm run validate:rules script blocking PR merge on schema violations"

journeys:
  - id: UJ-1
    title: "Alex frees up 15GB of disk space before a large game download"
    narrative: "Alex (software developer and gamer) is running out of disk space on their gaming PC. They open Kudu, click 'One-Click Clean', review the scan results showing 12GB in temp/shader caches and 3GB in browser data, click 'Clean Now', and watch the space counter increment to 15.2GB freed in 45 seconds."
  - id: UJ-2
    title: "Maria checks for malware after downloading an untrusted file"
    narrative: "Maria (privacy-conscious user) downloaded an installer from a third-party site and wants to verify system safety. She opens Kudu, navigates to Security, selects 'Quick Malware Scan', Kudu evaluates running processes and common persistence locations against YARA rules in 20 seconds, and reports 'No threats detected'."
  - id: UJ-3
    title: "DevOps engineer automates weekly server cleanup via CLI"
    narrative: "DevOps engineer configures a weekly cron job on an Ubuntu build server running `kudu clean --system --temp --quiet`. The job executes headlessly in 12 seconds, removes 45GB of stale build artifacts, logs JSON metrics to syslog, and exits cleanly with code 0."
